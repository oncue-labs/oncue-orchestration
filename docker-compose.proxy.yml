services:
  oncue-backend:
    environment:
      ONCUE_VOICE_SIGNALING_URL: wss://oncue.duckdns.org/v1/signaling

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - oncue-backend
      - oncue-voice
    networks:
      - oncue

volumes:
  caddy_data:
  caddy_config:
