services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - oncue-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - oncue

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - oncue-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - oncue

  oncue-backend:
    build:
      context: ../../oncue-backend
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      ONCUE_AUTH_X_CLIENT_ID: ${ONCUE_AUTH_X_CLIENT_ID}
      ONCUE_AUTH_X_CLIENT_SECRET: ${ONCUE_AUTH_X_CLIENT_SECRET}
      X_REDIRECT_URI: ${X_REDIRECT_URI}
      VOICE_JWT_PRIVATE_KEY: ${VOICE_JWT_PRIVATE_KEY}
      VOICE_SERVER_URL: http://oncue-voice:8000
      VOICE_INTERNAL_SERVICE_TOKEN: ${VOICE_INTERNAL_SERVICE_TOKEN}
      APNS_KEY_ID: ${APNS_KEY_ID}
      APNS_TEAM_ID: ${APNS_TEAM_ID}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID}
      APNS_PRIVATE_KEY_FILE: /run/secrets/apns-auth-key.p8
      ONCUE_VOICE_SIGNALING_URL: ws://${ONCUE_PUBLIC_HOST}:${VOICE_PORT}/v1/signaling
      ONCUE_VOICE_ICE_SERVERS_URLS: "stun:${ONCUE_PUBLIC_HOST}:${TURN_PORT},turn:${ONCUE_PUBLIC_HOST}:${TURN_PORT}?transport=udp,turn:${ONCUE_PUBLIC_HOST}:${TURN_PORT}?transport=tcp"
      ONCUE_VOICE_ICE_SERVERS_USERNAME: ${TURN_USERNAME}
      ONCUE_VOICE_ICE_SERVERS_CREDENTIAL: ${TURN_CREDENTIAL}
      ONCUE_LOCAL_TEST_CALL_ENABLED: ${ONCUE_LOCAL_TEST_CALL_ENABLED:-true}
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - ${APNS_SECRET_DIR_HOST:-./.secrets}:/run/secrets:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - oncue

  oncue-voice:
    build:
      context: ../../oncue-voice
      dockerfile: Dockerfile
    environment:
      ONCUE_VOICE_HOST: 0.0.0.0
      ONCUE_VOICE_PORT: 8000
      ONCUE_VOICE_INTERNAL_SERVICE_TOKEN: ${VOICE_INTERNAL_SERVICE_TOKEN}
      ONCUE_VOICE_JWT_PUBLIC_KEY: ${ONCUE_VOICE_JWT_PUBLIC_KEY}
      BACKEND_INTERNAL_URL: http://oncue-backend:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ONCUE_VOICE_RUNTIME: ${ONCUE_VOICE_RUNTIME}
      ONCUE_EVALUATION_PROVIDER: ${ONCUE_EVALUATION_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL}
      OPENAI_TTS_VOICE_ID: ${OPENAI_TTS_VOICE_ID}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE}
      ONCUE_VOICE_TURN_URLS: "turn:${ONCUE_PUBLIC_HOST}:${TURN_PORT}?transport=udp,turn:${ONCUE_PUBLIC_HOST}:${TURN_PORT}?transport=tcp"
      ONCUE_VOICE_TURN_USERNAME: ${TURN_USERNAME}
      ONCUE_VOICE_TURN_CREDENTIAL: ${TURN_CREDENTIAL}
    ports:
      - "${VOICE_PORT}:8000"
    depends_on:
      oncue-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - oncue

  coturn:
    image: coturn/coturn:4.6
    network_mode: host
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --realm=${ONCUE_TURN_REALM}
      - --user=${TURN_USERNAME}:${TURN_CREDENTIAL}
      - --min-port=${ONCUE_TURN_MIN_PORT}
      - --max-port=${ONCUE_TURN_MAX_PORT}
      - --external-ip=${ONCUE_PUBLIC_HOST}
    volumes:
      - ../../oncue-voice/docker/turn/coturn.conf:/etc/coturn/turnserver.conf:ro

volumes:
  oncue-mysql-data:
  oncue-redis-data:

networks:
  oncue:
    name: ${COMPOSE_PROJECT_NAME:-oncue}_network
    driver: bridge
    ipam:
      config:
        - subnet: ${ONCUE_DOCKER_SUBNET:-172.30.0.0/24}
