services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - oncue-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - oncue-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  oncue-backend:
    build:
      context: ../../oncue-backend
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      VOICE_SERVER_URL: http://oncue-voice:8000
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  oncue-voice:
    build:
      context: ../../oncue-voice
      dockerfile: Dockerfile
    environment:
      ONCUE_VOICE_HOST: 0.0.0.0
      ONCUE_VOICE_PORT: 8000
      ONCUE_VOICE_INTERNAL_SERVICE_TOKEN: ${VOICE_INTERNAL_SERVICE_TOKEN}
      BACKEND_INTERNAL_URL: http://oncue-backend:8080
      ONCUE_EVALUATION_PROVIDER: ${ONCUE_EVALUATION_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL}
      OPENAI_STT_MODEL: ${OPENAI_STT_MODEL}
      OPENAI_TTS_VOICE_ID: ${OPENAI_TTS_VOICE_ID}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE}
      ONCUE_VOICE_TURN_URLS: turn:localhost:3478?transport=udp,turn:localhost:3478?transport=tcp
      ONCUE_VOICE_TURN_USERNAME: ${TURN_USERNAME}
      ONCUE_VOICE_TURN_CREDENTIAL: ${TURN_CREDENTIAL}
    ports:
      - "${VOICE_PORT}:8000"
    depends_on:
      oncue-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  coturn:
    image: coturn/coturn:4.6
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --realm=${ONCUE_TURN_REALM}
      - --user=${TURN_USERNAME}:${TURN_CREDENTIAL}
      - --min-port=${ONCUE_TURN_MIN_PORT}
      - --max-port=${ONCUE_TURN_MAX_PORT}
    volumes:
      - ../../oncue-voice/docker/turn/coturn.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "${TURN_PORT}:3478/tcp"
      - "${TURN_PORT}:3478/udp"
      - "${TURN_TLS_PORT}:5349/tcp"
      - "${TURN_RELAY_PORT_START}-${TURN_RELAY_PORT_END}:${TURN_RELAY_PORT_START}-${TURN_RELAY_PORT_END}/udp"
      - "${TURN_RELAY_PORT_START}-${TURN_RELAY_PORT_END}:${TURN_RELAY_PORT_START}-${TURN_RELAY_PORT_END}/tcp"

volumes:
  oncue-mysql-data:
  oncue-redis-data:
